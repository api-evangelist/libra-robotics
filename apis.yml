aid: libra-robotics
name: Libra Robotics
description: >-
  Libra Robotics is a Silicon Valley robotics startup building autonomous robots
  that install solar panels in the field, targeting projects from 1 MW upward
  across utility-scale, commercial and industrial, community solar, and
  agrivoltaic applications. The company's field system — marketed as Libra 001 —
  combines purpose-built end-effectors, suction-based panel handling and
  transport, vision and positioning systems that align each module with the
  tracker structure, and fastener workflows compatible with multiple commercial
  racking systems, operating across day and night shifts. Libra Robotics was
  founded by Yaojing Huang and Jermaine Zhao, is part of the Y Combinator Summer
  2026 batch, and operates out of Newark, California. As of this profile the
  company publishes no public API, developer portal, SDKs, or machine-readable
  specifications; its web presence is a six-page marketing site covering
  solutions, technology, safety, company, and contact.
